services:
  postgres:
    image: postgres:18-alpine
    container_name: portfolio-intelligence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - portfolio-postgres-data:/var/lib/postgresql

volumes:
  portfolio-postgres-data:
