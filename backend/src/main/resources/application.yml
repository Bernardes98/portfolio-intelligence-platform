spring:
  application:
    name: portfolio-intelligence-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/portfolio_intelligence}
    username: ${DATABASE_USERNAME:portfolio}
    password: ${DATABASE_PASSWORD:portfolio}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 125MB

  mvc:
    problemdetails:
      enabled: true

  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

portfolio:
  storage:
    location: ${STORAGE_LOCATION:storage}
    max-files-per-analysis: ${MAX_FILES_PER_ANALYSIS:6}
    max-file-size: ${MAX_FILE_SIZE:20MB}